name: Bina APK Android

# Bina APK hybrid (Capacitor) setiap kali fail web berubah, kemudian lampirkan ke GitHub Releases.
# Pautan tetap APK terkini:
#   https://github.com/<pemilik>/<repo>/releases/latest/download/smart-bengkel-inventory.apk
#
# Tandatangan APK:
#   Jika secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS dan
#   ANDROID_KEY_PASSWORD wujud, APK ditandatangan dengan kunci tetap (boleh kemas kini tanpa nyahpasang).
#   Jika tiada, APK ditandatangan dengan kunci debug (boleh dipasang, tetapi setiap versi baharu
#   perlu nyahpasang versi lama dahulu).

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'vendor/**'
      - 'icons/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_NAME: smart-bengkel-inventory.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Pasang pakej npm
        run: npm ci

      - name: Jana projek Android (Capacitor) + ikon
        run: |
          npm run build:www
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Tetapkan nombor versi
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          VN="1.0.${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode 1$/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "VERSI=${VN}" >> "$GITHUB_ENV"

      - name: Semak kunci tandatangan
        id: kunci
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "ada=ya" >> "$GITHUB_OUTPUT"; else echo "ada=tidak" >> "$GITHUB_OUTPUT"; fi

      - name: Bina APK (release, kunci tetap)
        if: steps.kunci.outputs.ada == 'ya'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "../$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "../$APK_NAME" | head -3
          echo "JENIS=release (kunci tetap)" >> "$GITHUB_ENV"

      - name: Bina APK (debug)
        if: steps.kunci.outputs.ada != 'ya'
        run: |
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"
          echo "JENIS=debug (kunci sementara)" >> "$GITHUB_ENV"

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-bengkel-inventory-apk
          path: ${{ env.APK_NAME }}

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.VERSI }}
          name: Smart Bengkel APK ${{ env.VERSI }}
          make_latest: true
          files: ${{ env.APK_NAME }}
          body: |
            APK Smart Bengkel Inventory versi ${{ env.VERSI }} — ${{ env.JENIS }}.

            Cara pasang di telefon Android:
            1. Muat turun `smart-bengkel-inventory.apk` di bawah.
            2. Buka fail tersebut. Jika diminta, benarkan "Pasang apl tidak diketahui" untuk pelayar/Fail.
            3. Log masuk dengan akaun yang sama seperti versi web.
